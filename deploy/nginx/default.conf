# ============================================================
# 酒店预订系统 - Nginx 站点配置
#   静态资源(Vue SPA history 路由兜底) + gzip/缓存
#   接口与 Swagger 反代到 app:8088
# ============================================================

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 后端单请求体大小上限（按需调整）
    client_max_body_size 10m;

    # ---------- 压缩 ----------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2;

    # ---------- 接口反代 ----------
    # 前缀必须与后端拦截器 API_PATTERNS 保持一致
    location ~ ^/(user|role|room|order|customer|statistics|checkin|client)/ {
        proxy_pass http://app:8088;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 接口文档（springdoc）也走反代，公网可访问 Swagger
    location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs|webjars) {
        proxy_pass http://app:8088;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 静态资源 ----------
    # Vite 产物：assets 文件名带哈希，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口页禁止缓存：发版后浏览器立即拿到新版本
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # 前端 history 路由兜底：刷新 /orders 等路径回退首页
    location / {
        try_files $uri $uri/ /index.html;
    }
}
