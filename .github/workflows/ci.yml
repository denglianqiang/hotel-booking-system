# ============================================================
# CI：后端集成测试 + Docker 镜像构建
#
# test 作业说明：
#   集成测试基于真实 MySQL（不用 H2/Mock，行锁、区间查询、唯一键
#   只有真库才测得出来），因此起一个 MySQL 8 服务容器并初始化
#   sql/hotel_db.sql；Redis 不需要，测试自动降级为内存实现。
# ============================================================
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:

  test:
    name: 集成测试（真实 MySQL）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hotel_db
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=60s
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（Maven 依赖缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 初始化数据库
        run: |
          mysql -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 < hotelmanagement/sql/hotel_db.sql
          mysql -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 < hotelmanagement/sql/answer_demo_data.sql

      - name: 运行集成测试
        working-directory: hotelmanagement
        env:
          DB_PASSWORD: root
        run: |
          chmod +x mvnw
          ./mvnw -B --ntp test

  docker-build:
    name: Docker 镜像构建验证
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 镜像多阶段构建包含整套 npm/maven 编译，避免僵尸缓存，直接 build 不 push
      - name: 构建后端镜像
        run: docker build -f Dockerfile -t hotel-management:ci .

      - name: 构建前端镜像
        run: docker build -f deploy/nginx/Dockerfile -t hotel-frontend:ci .

      - name: Compose 配置校验
        # CI 上没有 .env，注入占位密码仅用于让 :? 强制存在语法通过
        run: DB_PASSWORD=dummy docker compose config --quiet && echo "compose 配置合法"
