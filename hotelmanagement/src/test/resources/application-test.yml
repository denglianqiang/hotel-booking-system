# ============================================================
# 测试专用覆盖（配合 @ActiveProfiles({"dev", "test"}) 使用）
#
# 集成测试不依赖 Redis：
#   - 会话退回内存实现（行为与 Redis 版一致：TTL + 滑动续期）
#   - 缓存退回进程内实现，@Cacheable / @CacheEvict 语义照常生效，
#     因此驱逐逻辑同样被测试覆盖；每个用例前手动清一次缓存，
#     避免 @Transactional 回滚后缓存里留下脏数据。
# 数据库配置沿用 dev profile（本机 MySQL 的 hotel_db）。
# ============================================================
hotel:
  token-store: memory
  cache-type: memory
